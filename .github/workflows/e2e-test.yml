# End-to-end module test — Phase 2 (spec: specs/2026-06-03-phase-2-e2e-test/).
#
# Runs the Terratest harness under test/ against the disposable AWS account:
# deploy THIS repo's module, consume the backend via its assume-role, assert the
# state object + DynamoDB digest exist, then destroy everything and leak-check.
#
# Auth is keyless OIDC (Phase 1 `s3backend-ci` role) — no long-lived secret.
#
# SECURITY: this job touches AWS, so it must NEVER run on a fork PR. There is no
# `pull_request` trigger, and the CI role's trust policy only admits
# refs/heads/main + refs/tags/* anyway (defence in depth). Triggers are
# push-to-main (Phase 2, Option A) and a daily schedule (Phase 3); both run on
# the default branch, so neither widens the trust surface.
name: Module Works

on:
  push:
    branches: [main]
  schedule:
    # Phase 3 — daily drift check: catch provider/AWS regressions without a
    # commit. 06:19 UTC, deliberately off the top-of-hour congestion. Scheduled
    # runs execute on the default branch (github.ref = refs/heads/main), which
    # the OIDC trust policy already admits — no trust change needed. Note:
    # GitHub disables scheduled workflows after 60 days of no repo activity.
    - cron: "19 6 * * *"
  workflow_dispatch:

# Least-privilege token permissions: id-token to mint the OIDC JWT, nothing else
# writable.
permissions:
  id-token: write
  contents: read

jobs:
  e2e:
    name: Terratest end-to-end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          # Repo variable set after applying ci/oidc-bootstrap (keeps the
          # account ID out of the repo). See the Phase 1 spec's oidc-setup.md.
          role-to-assume: ${{ vars.CI_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # Pin to the exact Go declared by the test module so CI == local.
          go-version-file: test/go.mod
          cache-dependency-path: test/go.sum

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.5
          terraform_wrapper: false

      # Runs the single GIVEN/WHEN/THEN test. The in-test leak assertion fails
      # the job if any module-tagged resource survives teardown, so no separate
      # leak step is needed. -timeout covers KMS+S3+DynamoDB+IAM create/destroy
      # twice (Phase 0 runs were ~3-5 min; 30m is generous headroom).
      - name: Run e2e test
        working-directory: test
        run: go test ./... -timeout 30m -v

  # Phase 3 — on a failed *scheduled* run, surface it as a `drift`-labelled
  # issue so an unattended failure is not silently lost. Gated to schedule only:
  # push/dispatch failures are already seen by whoever triggered them. Separate
  # job so `issues: write` stays off the AWS-touching job (least privilege); it
  # carries no id-token.
  drift-issue:
    name: Open drift issue on scheduled failure
    needs: e2e
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the drift issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Ensure the label exists (idempotent — ignore "already exists").
          gh label create drift --color B60205 \
            --description "Scheduled e2e drift-check failure" 2>/dev/null || true
          # Dedup: one open drift issue at a time — comment on it rather than
          # stacking a new issue every day the drift persists.
          existing="$(gh issue list --label drift --state open \
            --json number --jq '.[0].number // empty')"
          stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          body="The daily scheduled end-to-end run failed — likely provider/AWS drift or a real module regression. Run: $RUN_URL (detected $stamp). If teardown also failed, the disposable account may hold an orphaned namespace; after investigating, sweep it with ./ci/cleanup-orphan-namespace.sh <namespace>."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again — $RUN_URL ($stamp)."
            echo "commented on existing drift issue #$existing"
          else
            gh issue create --title "Scheduled e2e drift check failed" \
              --label drift --body "$body"
            echo "opened a new drift issue"
          fi